<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048 Solver</title>
<style>
body {
  font-family: sans-serif;
  margin: 2em;
  background: #fafafa;
}
textarea {
  width: 100%;
  height: 120px;
  font-family: monospace;
  font-size: 16px;
}
button {
  margin-top: 1em;
  padding: 0.6em 1.2em;
  font-size: 16px;
}
#result {
  margin-top: 1em;
  font-weight: bold;
  color: #333;
}
</style>
</head>
<body>
<h2>2048 Move Solver</h2>
<p>Enter a 4×4 board (16 numbers, separated by spaces):</p>

<textarea id="boardInput">0 2 4 8
0 4 2 4
0 2 4 2
0 4 2 4</textarea>
<br>
<button id="solveBtn">Get Best Move</button>

<p id="result"></p>

<script type="text/javascript">
  var Module = {
    onRuntimeInitialized: function() {
      const solveMove = Module.cwrap('solve_move', 'string', ['string']);
      document.getElementById('solveBtn').onclick = function() {
        const input = document.getElementById('boardInput').value.replace(/\s+/g, ' ');
        const result = solveMove(input);
        document.getElementById('result').innerText = result;
      };
    }
  };
</script>
<script src="solver.js"></script>
</body>
</html>
