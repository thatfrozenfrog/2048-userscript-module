name: Compiler

on: [push, pull_request]
jobs:
  build:
    name: Emscripten compile
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          emsdk: latest

      - name: verify emcc
        run: emcc -v
      - name: build
        run: |
          mkdir -p dist
          emcc solver.cpp -O3 -std=c++17 -s WASM=0 -o dist/solver.js \
            -s EXPORTED_FUNCTIONS='["_solve_move"]' \
            -s EXPORTED_RUNTIME_METHODS='["ccall","cwrap"]'
      - name: Create pull request with build artifacts
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Build: Emscripten build on ${{ github.sha }}"
          branch: "build-${{ github.run_id }}"
          title: "Build: dist/solver.js"
          body: "Automated Emscripten build (sha: ${{ github.sha }})"
          labels: "autobuild"
          paths: "dist/*"